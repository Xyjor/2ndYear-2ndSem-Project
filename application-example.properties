# Company DMS - Application Configuration
# This is an example configuration file. Copy this to application.properties and customize for your environment.
# You can also set these values as environment variables, which take precedence if application.properties is not found.

# Database Configuration
# Default: jdbc:postgresql://localhost:5432/company_dms
DB_URL=jdbc:postgresql://localhost:5432/company_dms

# Database User
# Default: company_app
DB_USER=company_app

# Database Password
# Default: company_app_dev (CHANGE THIS IN PRODUCTION!)
DB_PASSWORD=company_app_dev

# HikariCP Connection Pool Settings
# Maximum number of connections in the pool
# Default: 10
DB_POOL_MAX=10

# Minimum number of idle connections to maintain
# Default: 2
DB_POOL_MIN_IDLE=2

# Environment-specific settings can be set via environment variables or this file
# For Docker/Kubernetes: Set DB_URL=jdbc:postgresql://db-service:5432/company_dms, etc.
# For CI/CD: Use environment variables or secrets management
